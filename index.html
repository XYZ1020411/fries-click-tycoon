renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,id:e.pointerId};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;yaw-=(e.clientX-drag.x)*.006;pitch=Math.max(-.1,Math.min(.8,pitch+(e.clientY-drag.y)*.004));drag.x=e.clientX;drag.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('pointercancel',()=>drag=null);
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-(animate.last||now))/1000);animate.last=now;
if(gameStarted){const f=(keys.w||keys.arrowup||touchMove.forward?1:0)-(keys.s||keys.arrowdown||touchMove.back?1:0),r=(keys.d||keys.arrowright||touchMove.right?1:0)-(keys.a||keys.arrowleft||touchMove.left?1:0);const speed=4.2;const dx=(Math.sin(yaw)*f+Math.cos(yaw)*r)*speed*dt,dz=(Math.cos(yaw)*f-Math.sin(yaw)*r)*speed*dt;player.position.x=Math.max(-16,Math.min(16,player.position.x+dx));player.position.z=Math.max(-16,Math.min(16,player.position.z+dz));if(f||r)player.rotation.y=Math.atan2(dx,dz);
near=getNear();$('interactBtn').classList.toggle('hidden',!near);$('interactBtn').textContent=near?'E｜'+near.name:'互動';
clockMinutes+=dt*1.8;if(clockMinutes>=1440)clockMinutes-=1440;
const night=clockMinutes>=1200||clockMinutes<480;$('phase').textContent=night?'🌙 夜間生存！注意異常顧客':'☀️ 白天營業中｜完成訂單並升級廚房';if(night){scene.background.set(0x10162b);scene.fog.color.set(0x10162b);sun.intensity=.18;keyLight.intensity=2.5;customer.visible=false;anomaly.visible=true;nightDanger+=dt;if(nightDanger>4){const d=Math.hypot(player.position.x-anomaly.position.x,player.position.z-anomaly.position.z);const tx=player.position.x, tz=player.position.z;anomaly.position.x+=(tx-anomaly.position.x)*dt*.12;anomaly.position.z+=(tz-anomaly.position.z)*dt*.12;if(d<1.35){if(s.defense){anomaly.position.set(0,0,-13);say('薯條防禦砲擊退了異常！')}else{say('你被異常抓到了！回到店門口重新開始。');player.position.set(0,0,2);s.money=Math.max(0,s.money-50);anomaly.position.set(0,0,-13)}}}if(s.defense&&nightDanger>8){anomaly.position.set(0,0,-13);nightDanger=0;log('防禦砲已擊退一次異常。')}}else{scene.background.set(0x8ed5f3);scene.fog.color.set(0x8ed5f3);sun.intensity=3;keyLight.intensity=.2;customer.visible=true;anomaly.visible=false;nightDanger=0}
if(s.robots&&Math.random()<dt*.2){s.potatoes=Math.min(s.bucket,s.potatoes+1)}if(s.autoFryer&&s.peeled>0&&Math.random()<dt*.25){s.fries+=2;s.peeled--}
if(!customerWait&&Math.random()<dt*.15){customerWait=50;log('🚗 有顧客正在窗口等候！快把薯條交出去。')}if(customerWait>0){customerWait-=dt;if(customerWait<=0)log('顧客等太久離開了！下次先準備好薯條。')}
if(Math.floor(now/1000)!==Math.floor((now-dt*1000)/1000))render();
const target=new THREE.Vector3(player.position.x,1.3,player.position.z);const offset=new THREE.Vector3(Math.sin(yaw)*8,3.5+pitch*5,Math.cos(yaw)*8);camera.position.lerp(target.clone().add(offset),.1);camera.lookAt(target);s.player={x:player.position.x,z:player.position.z}
}
renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
sb.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user)});render();requestAnimationFrame(animate);
</script>
