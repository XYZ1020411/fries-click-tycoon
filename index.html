<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL="https://pmdbdckspefacykvfvbq.supabase.co", SUPABASE_ANON_KEY="sb_publishable_R1p34EuAIB00lCGvu-CgtA_bX_lBPw9";
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
let user=null,room=null,roomChannel=null,saveTimer=null,playerTimer=null,autoTimer=null;
let state={money:0,clicks:0,power:1,auto:0,shop:1,px:0,pz:0};
const moneyFmt=n=>Math.floor(n).toLocaleString('zh-TW');
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function costs(){return {power:Math.floor(20*Math.pow(1.75,state.power-1)),auto:Math.floor(80*Math.pow(1.8,state.auto)),shop:Math.floor(200*Math.pow(2,state.shop-1))}}
function render(){for(const [id,v] of Object.entries({money:moneyFmt(state.money),clicks:moneyFmt(state.clicks),power:state.power}))$(id).textContent=v;const c=costs();$('powerCost').textContent='· '+moneyFmt(c.power)+' 幣';$('autoCost').textContent='· '+moneyFmt(c.auto)+' 幣';$('shopCost').textContent='· '+moneyFmt(c.shop)+' 幣'}
function saveLocal(){try{localStorage.setItem('fries3d',JSON.stringify(state))}catch{}scheduleSave()}
function scheduleSave(){if(!user)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveCloud,900)}
async function saveCloud(){if(!user)return;const {error}=await supabase.from('fries_game_saves').upsert({user_id:user.id,state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)toast('雲端存檔失敗：'+error.message);else toast('☁️ 雲端存檔成功')}
async function loadCloud(){const {data,error}=await supabase.from('fries_game_saves').select('state').eq('user_id',user.id).maybeSingle();if(error){toast('讀取雲端存檔失敗');return}if(data?.state){state={...state,...data.state};player.position.set(state.px||0,0.8,state.pz||0);toast('已載入雲端進度')}else{try{const l=JSON.parse(localStorage.getItem('fries3d')||'null');if(l)state={...state,...l}}catch{}toast('歡迎來到薯條島！')}render();saveLocal()}
async function enter(u){user=u;$('authShell').classList.add('hidden');$('hud').classList.remove('hidden');await loadCloud();if(autoTimer)clearInterval(autoTimer);autoTimer=setInterval(()=>{if(state.auto>0){state.money+=state.auto;render();saveLocal()}},5000)}
$('authForm').addEventListener('submit',async e=>{e.preventDefault();$('authMsg').textContent='正在登入…';const {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('authMsg').textContent=error.message;return}await enter(data.user)});
$('signupBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){$('authMsg').textContent='請輸入有效電子郵件與至少 6 位密碼';return}$('authMsg').textContent='正在建立帳號…';const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:location.origin}});if(error){$('authMsg').textContent=error.message;return}if(data.session)await enter(data.user);else $('authMsg').textContent='註冊成功！請到信箱驗證，再回到本遊戲登入。驗證信應導回 '+location.origin};
$('resetBtn').onclick=async()=>{const email=$('email').value.trim();if(!email){$('authMsg').textContent='請先輸入電子郵件';return}const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin});$('authMsg').textContent=error?error.message:'已寄出重設密碼信，請檢查信箱。'};
$('logoutBtn').onclick=async()=>{await leaveRoom();await supabase.auth.signOut();user=null;$('hud').classList.add('hidden');$('authShell').classList.remove('hidden')};
$('saveBtn').onclick=saveCloud;
supabase.auth.onAuthStateChange((_event,session)=>{if(session?.user&&!user)enter(session.user)});
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9be5ff);scene.fog=new THREE.Fog(0x9be5ff,28,85);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x607c4b,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-8,18,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=mat(0x6bd17b),sand=mat(0xffd98a),wood=mat(0x9b6037),cream=mat(0xffefc4),red=mat(0xff5b5b),blue=mat(0x4a90e2),white=mat(0xffffff),dark=mat(0x332b3d),yellow=mat(0xffc83d),gold=mat(0xf5a623);
function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
const ground=new THREE.Mesh(new THREE.CylinderGeometry(32,34,1.2,64),grass);ground.position.y=-.65;ground.receiveShadow=true;scene.add(ground);
const beach=new THREE.Mesh(new THREE.CylinderGeometry(33,35,.4,64),sand);beach.position.y=-.9;scene.add(beach);
const water=new THREE.Mesh(new THREE.CylinderGeometry(42,43,.5,64),new THREE.MeshStandardMaterial({color:0x28b9e8,roughness:.35,metalness:.05}));water.position.y=-1.35;scene.add(water);
// stylized low-poly trees around the island
for(let i=0;i<36;i++){const a=i*Math.PI*2/36,r=24+(i%3)*2,x=Math.cos(a)*r,z=Math.sin(a)*r;box(.5,2,.5,wood,x,.5,z);const crown=new THREE.Mesh(new THREE.ConeGeometry(1.5,3,6),mat(i%2?0x219653:0x36b96b));crown.position.set(x,2.4,z);crown.castShadow=true;scene.add(crown)}
// fry shop
box(8,3,5,cream,0,1.2,-8);box(8.5,.5,5.5,red,0,3,-8);box(5,.45,.3,red,0,2.2,-5.42);box(3,1.2,.25,white,0,1.45,-5.38);box(2,.35,.3,dark,0,1.6,-5.2);
const awning=box(8,.35,1.5,red,0,2.9,-4.5);awning.rotation.x=-.1;
for(let i=-3;i<=3;i+=1.5)box(.5,.4,1.55,white,i,2.9,-4.5);
const sign=box(4,.9,.25,yellow,0,4,-8);const signCanvas=document.createElement('canvas');signCanvas.width=512;signCanvas.height=128;const ctx=signCanvas.getContext('2d');ctx.fillStyle='#ffc83d';ctx.fillRect(0,0,512,128);ctx.fillStyle='#54233b';ctx.font='bold 56px sans-serif';ctx.textAlign='center';ctx.fillText('FRIES TYCOON',256,82);const tex=new THREE.CanvasTexture(signCanvas);const signFace=new THREE.Mesh(new THREE.PlaneGeometry(3.8,.8),new THREE.MeshBasicMaterial({map:tex}));signFace.position.set(0,4,-7.84);scene.add(signFace);
box(2.3,1.2,1.8,wood,0,.25,-2.8);box(2.4,.25,1.9,gold,0,.95,-2.8);
// character
const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1,.45),blue);body.position.y=1.15;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.68,.68,.68),mat(0xffd4a6));head.position.y=2;head.castShadow=true;player.add(head);const hair=new THREE.Mesh(new THREE.BoxGeometry(.72,.22,.72),dark);hair.position.y=2.37;player.add(hair);const eyeMat=new THREE.MeshBasicMaterial({color:0x241b35});for(const x of [-.16,.16]){const eye=new THREE.Mesh(new THREE.BoxGeometry(.07,.08,.03),eyeMat);eye.position.set(x,2.03,.35);player.add(eye)}for(const x of [-.25,.25]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.24,.65,.28),dark);leg.position.set(x,.35,0);player.add(leg);const arm=new THREE.Mesh(new THREE.BoxGeometry(.22,.7,.25),mat(0xffd4a6));arm.position.set(x*2,1.18,0);player.add(arm)}
// floating collectible fries
const fries=[];function makeFries(x,y,z){const g=new THREE.Group();const cup=new THREE.Mesh(new THREE.BoxGeometry(.65,.55,.45),red);cup.position.y=0;g.add(cup);for(let i=0;i<5;i++){const f=new THREE.Mesh(new THREE.BoxGeometry(.11,.62,.1),yellow);f.position.set((i-2)*.12,.48,0);f.rotation.z=(i-2)*.05;g.add(f)}g.position.set(x,y,z);g.userData.baseY=y;scene.add(g);fries.push(g)}
for(let i=0;i<12;i++){const a=i*Math.PI*2/12,r=6+(i%3)*2;makeFries(Math.cos(a)*r,.9,Math.sin(a)*r)}
function spawnFries(){if(fries.length<18){const a=Math.random()*Math.PI*2,r=4+Math.random()*15;makeFries(Math.cos(a)*r,.9,Math.sin(a)*r)}}
let yaw=0,move={forward:false,back:false,left:false,right:false},drag=null,keys={};
function updateMove(dt){let dx=0,dz=0;if(move.forward||keys.KeyW||keys.ArrowUp)dz-=1;if(move.back||keys.KeyS||keys.ArrowDown)dz+=1;if(move.left||keys.KeyA||keys.ArrowLeft)dx-=1;if(move.right||keys.KeyD||keys.ArrowRight)dx+=1;if(dx||dz){const len=Math.hypot(dx,dz);dx/=len;dz/=len;const rx=dx*Math.cos(yaw)+dz*Math.sin(yaw),rz=-dx*Math.sin(yaw)+dz*Math.cos(yaw);player.position.x=THREE.MathUtils.clamp(player.position.x+rx*dt*6,-27,27);player.position.z=THREE.MathUtils.clamp(player.position.z+rz*dt*6,-27,27);player.rotation.y=Math.atan2(rx,rz)}state.px=player.position.x;state.pz=player.position.z}
function collect(){const p=player.position;let best=null,dist=2.8;for(const f of fries){const d=f.position.distanceTo(new THREE.Vector3(p.x,.9,p.z));if(d<dist){dist=d;best=f}}if(best){scene.remove(best);fries.splice(fries.indexOf(best),1);state.money+=state.power;state.clicks++;render();saveLocal();spawnFries();if(room)syncPlayer();toast('+'+state.power+' 薯條幣 🍟')}else{state.money+=state.power;state.clicks++;render();saveLocal();toast('+'+state.power+' 薯條幣')} }
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false};renderer.domElement.setPointerCapture?.(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.lastX,dy=e.clientY-drag.lastY;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)drag.moved=true;if(drag.moved){yaw-=dx*.006;camera.position.y=THREE.MathUtils.clamp(camera.position.y+dy*.025,4,15)}drag.lastX=e.clientX;drag.lastY=e.clientY});
renderer.domElement.addEventListener('pointerup',()=>{if(drag&&!drag.moved)collect();drag=null});
document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;const on=e=>{e.preventDefault();move[k]=true};const off=e=>{e.preventDefault();move[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
$('lookLeft').onclick=()=>yaw+=.3;$('lookRight').onclick=()=>yaw-=.3;$('collectTouch').onclick=collect;
$('buyPower').onclick=()=>{const c=costs().power;if(state.money<c)return toast('薯條幣不足！');state.money-=c;state.power++;render();saveLocal();toast('升級成功！')};
$('buyAuto').onclick=()=>{const c=costs().auto;if(state.money<c)return toast('薯條幣不足！');state.money-=c;state.auto++;render();saveLocal();toast('自動炸鍋升級！')};
$('buyShop').onclick=()=>{const c=costs().shop;if(state.money<c)return toast('薯條幣不足！');state.money-=c;state.shop++;render();const s=1+(state.shop-1)*.12;scene.scale.setScalar(Math.min(1.35,s));saveLocal();toast('店面擴建成功！')};
async function syncPlayer(){if(!user||!room)return;await supabase.from('fries_multiplayer_players').upsert({room_code:room,user_id:user.id,display_name:user.email?.split('@')[0]||'玩家',money:Math.floor(state.money),clicks:state.clicks,updated_at:new Date().toISOString()},{onConflict:'room_code,user_id'});const {data}=await supabase.from('fries_multiplayer_players').select('display_name,money,clicks').eq('room_code',room).order('money',{ascending:false});$('players').innerHTML=(data||[]).map(p=>'<div>👤 '+escapeHtml(p.display_name)+' · 🍟 '+moneyFmt(p.money)+'</div>').join('')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function join(code,create=false){if(!user)return;if(create){code=Math.random().toString(36).slice(2,8).toUpperCase();const {error}=await supabase.from('fries_multiplayer_rooms').insert({room_code:code,host_id:user.id,room_name:'薯條島 '+code});if(error)return toast('建立房間失敗：'+error.message)}else{const {data,error}=await supabase.from('fries_multiplayer_rooms').select('room_code').eq('room_code',code).maybeSingle();if(error||!data)return toast('找不到這個房間')}
await leaveRoom();room=code;$('roomText').textContent='房間代碼：'+code;$('roomCode').value=code;await syncPlayer();roomChannel=supabase.channel('fries-room-'+code).on('postgres_changes',{event:'*',schema:'public',table:'fries_multiplayer_players',filter:'room_code=eq.'+code},()=>syncPlayer()).subscribe();playerTimer=setInterval(syncPlayer,5000);toast('已加入多人房間 '+code)}
async function leaveRoom(){if(playerTimer)clearInterval(playerTimer);playerTimer=null;if(roomChannel){await supabase.removeChannel(roomChannel);roomChannel=null}if(user&&room)await supabase.from('fries_multiplayer_players').delete().eq('room_code',room).eq('user_id',user.id);room=null;$('roomText').textContent='尚未加入房間';$('players').textContent=''}
$('createRoom').onclick=()=>join('',true);$('joinRoom').onclick=()=>join($('roomCode').value.trim().toUpperCase());window.addEventListener('beforeunload',()=>{if(user)saveCloud()});
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;updateMove(dt);const t=now*.001;fries.forEach((f,i)=>{f.position.y=f.userData.baseY+Math.sin(t*2+i)*.16;f.rotation.y=t*.55+i});const target=new THREE.Vector3(player.position.x,1.1,player.position.z);const offset=new THREE.Vector3(Math.sin(yaw)*10,6+((camera.position.y-6)*.12),Math.cos(yaw)*10);camera.position.lerp(target.clone().add(offset),.08);camera.lookAt(target);renderer.render(scene,camera)}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
render();
const {data:{session}}=await supabase.auth.getSession();if(session?.user)await enter(session.user);
</script></body></html>
